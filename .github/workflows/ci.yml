name: Run CI test

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - release/**
      - hotfix/**
    tags:
  workflow_dispatch:

jobs:
  qa:
    name: Full QA / PHP 8.3 / PHPUnit 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer normalize --dry-run
      - run: vendor/bin/grumphp run --no-interaction --tasks=""

  phpunit:
    name: PHPUnit ${{ matrix.phpunit }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        phpunit: ['11.5', '12.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
      - run: composer update --prefer-dist --no-interaction --with-all-dependencies --with="phpunit/phpunit:^${{ matrix.phpunit }}"
      - run: vendor/bin/grumphp run --no-interaction --tasks=phpunit
